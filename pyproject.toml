[project]
name = "occam"
version = "0.1.0"
description = "Cost-aware Agentic GraphRAG on TigerGraph: proving when agentic retrieval earns its token cost"
requires-python = ">=3.11"
dependencies = [
    "pyTigerGraph>=1.8",
    "google-genai>=1.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "rich>=13.7",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["occam"]
